[env]
TERM = "xterm-256color"

[window]
padding = { x = 6, y = 6 }
decorations = "full"
startup_mode = "Windowed"
opacity = 0.99
blur = true

[font]
size = 12

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[cursor.style]
shape = "Block"
blinking = "Off"

[cursor]
blink_interval = 500

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[scrolling]
history = 10000
multiplier = 3

[terminal.shell]
program = "ubuntu.exe"
